name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-scan:
    name: Vulnerability scanner
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run vulnerability scanner
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 tools/vulnerability_scanner.py training-fixtures/fixed.js \
            | tee artifacts/medusa-ci-scan-findings.txt

      - name: Upload scanner findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-findings
          path: artifacts/medusa-ci-scan-findings.txt
          if-no-files-found: warn